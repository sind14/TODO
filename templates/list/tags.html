{% extends "base.html" %}
{% block content %}
  <div class="d-flex justify-content-between align-items-center">
    <h1>Tags</h1>
    <a href="{% url "list:add_tag" %}" class="btn btn-primary">Add</a>
  </div>

  <table class="table mt-3">
    <thead>
    <tr>
      <th>Name</th>
      <th>Update</th>
      <th>Delete</th>
    </tr>
    </thead>
    <tbody>
    {% for tag in tags_list %}
      <tr>
        <td>{{ tag.name }}</td>
        <td>
          <a href="{% url "list:update_tag" tag.pk %}" class="btn btn-secondary">Update</a>
        </td>
        <td>
          <a href="{% url "list:delete_tag" tag.pk %}" class="btn btn-danger">Delete</a>
        </td>
      </tr>
    {% endfor %}
    </tbody>
  </table>
{% endblock %}
