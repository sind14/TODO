{% extends "base.html" %}
{% load custom_tags %}
{% block content %}
<h1>Task</h1>
<form method="post">
  {% csrf_token %}
  {% for field in form %}
    <div>
      {{ field.label_tag }}<br>
      {{ field|add_class:"form-control" }}<br>
      {% if field.errors %}
        <div class="text-danger">
          {{ field.errors }}
        </div>
      {% endif %}
    </div>
  {% endfor %}
  <button type="submit" class="btn btn-primary">Save</button>
</form>
{% endblock %}
